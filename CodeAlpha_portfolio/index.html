<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="calculator">
        <div class="top-buttons">

            <button onclick="toggleTheme()" class="theme-btn">
                🌙 / ☀️
            </button>

            <button onclick="showHistory()" class="history-open-btn">
                🕘 History
            </button>

        </div>
        <input
        type="text"
        id="display"
        aria-label="Calculator display"
        readonly>

        <div class="buttons">

            <button onclick="clearDisplay()" class="clear">C</button>
            <button onclick="deleteLast()">⌫</button>
            <button onclick="percentage()">%</button>
            <button onclick="append('/')">÷</button>

            <button onclick="append('7')">7</button>
            <button onclick="append('8')">8</button>
            <button onclick="append('9')">9</button>
            <button onclick="append('*')">×</button>

            <button onclick="append('4')">4</button>
            <button onclick="append('5')">5</button>
            <button onclick="append('6')">6</button>
            <button onclick="append('-')">−</button>

            <button onclick="append('1')">1</button>
            <button onclick="append('2')">2</button>
            <button onclick="append('3')">3</button>
            <button onclick="append('+')">+</button>

            <button onclick="append('0')" class="zero">0</button>
            <button onclick="append('.')">.</button>
            <button onclick="calculate()" class="equal">=</button>

        </div>

    <div id="historyBox" class="history">

    <h3>Calculation History</h3>

    <ul id="historyList"></ul>

    <button onclick="clearHistory()" class="history-btn">
        Clear History
    </button>

    <button onclick="closeHistory()" class="back-btn">
        ← Back
    </button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
